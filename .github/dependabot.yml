# Mises à jour automatiques des dépendances : une PR groupée par mois et par
# écosystème pour les versions mineures et correctives, une PR par paquet pour
# les versions majeures (à relire avant de merger).
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    groups:
      python:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    commit-message:
      prefix: "ci"
    groups:
      actions:
        patterns: ["*"]
