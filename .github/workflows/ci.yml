name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff format --check src tests
      - run: ruff check src tests

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: poseidon
          POSTGRES_PASSWORD: poseidon
          POSTGRES_DB: poseidon_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U poseidon -d poseidon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSEIDON_TEST_DATABASE_URL: postgresql://poseidon:poseidon@localhost:5432/poseidon_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest --cov --cov-report=term-missing
