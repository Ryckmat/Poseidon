name: Process new TCX

on:
  push:
    paths:
      - "data/**/*.tcx"
  workflow_dispatch:

jobs:
  process:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      MAX_POWER: 250
      STABLE_WINDOW_S: 30
      STABLE_STD_THRESHOLD: 5
      MIN_STABLE_DURATION_S: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -e .

      - name: Ingest and analyze new TCX files
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            files=$(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- 'data/*.tcx' 'data/**/*.tcx')
          else
            files=$(find data -name '*.tcx' 2>/dev/null || true)
          fi
          if [ -z "$files" ]; then
            echo "No TCX file to process."
            exit 0
          fi
          for f in $files; do
            echo "=== $f ==="
            session_id=$(poseidon-ingest "$f" | tail -n 1)
            poseidon-analyze "$session_id"
          done
