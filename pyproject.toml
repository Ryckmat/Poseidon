[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poseidon"
version = "0.3.0"
description = "Analyse de séances de rameur à partir de fichiers TCX"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matthieu Ryckman" }]
requires-python = ">=3.11"
dependencies = [
  "pandas==3.1.0",
  "numpy==2.4.6",
  "sqlalchemy==2.1.6",
  "psycopg[binary]==3.3.6",
  "python-dotenv==1.2.4",
  "defusedxml==0.7.1",
  "streamlit==1.66.1",
  "plotly==7.1.0",
  "kaleido==1.5.0",
  "fpdf2==2.8.9",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "pytest-cov==7.1.0", "ruff==0.17.3", "pre-commit==4.7.0"]

[project.scripts]
poseidon = "poseidon.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = [
  "B008",   # valeur par défaut dataclass figée (BoundaryFix())
  "RUF001", # caractères ambigus dans les libellés français
  "RUF002",
  "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["poseidon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "postgres: nécessite une base PostgreSQL (POSEIDON_TEST_DATABASE_URL)",
]
filterwarnings = [
  "ignore::DeprecationWarning:kaleido.*",
]

[tool.coverage.run]
source = ["poseidon"]
