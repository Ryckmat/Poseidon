[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "poseidon"
version = "0.2.0"
description = "Analyse de séances d'entraînement TCX (puissance, cadence, vitesse)"
requires-python = ">=3.11"
dependencies = [
  "pandas==2.1.2",
  "numpy==1.26.1",
  "sqlalchemy==2.0.22",
  "psycopg2-binary==2.9.7",
  "python-dotenv==1.0.0",
  "streamlit==1.26.0",
  "plotly==5.15.0",
  "fpdf2==2.7.6",
  "kaleido==0.2.1",
]

[project.optional-dependencies]
dev = ["pytest==7.4.3", "black==23.9.1", "isort==5.13.2", "flake8==6.1.0"]

[project.scripts]
poseidon-ingest = "poseidon.ingest.cli:main"
poseidon-analyze = "poseidon.processing.analysis:main"
poseidon-init-db = "poseidon.db.session:init_db"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
known_first_party = ["poseidon"]

[tool.pytest.ini_options]
testpaths = ["tests"]
