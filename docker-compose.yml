# Base PostgreSQL locale pour le développement et les tests d'intégration.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: poseidon
      POSTGRES_PASSWORD: poseidon
      POSTGRES_DB: poseidon
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "poseidon"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
